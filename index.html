<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIL JUEGO ARQ</title><style>body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}#ui{position:absolute;top:10px;left:10px;background:#111;padding:12px;border-radius:12px;width:280px;border:1px solid #0f0}#game{position:absolute;top:10px;right:10px;background:#111;padding:12px;border-radius:12px;width:180px;border:1px solid #ff0;text-align:center}button{background:#0f0;color:#000;border:none;padding:8px;border-radius:6px;font-weight:bold;width:100%;margin-top:6px}input{width:100%}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><div id="ui"><h3 style="margin:0;color:#0f0">GIL JUEGO ARQ - OPCION 2</h3><p style="font-size:9px;color:#888">Ajusta x a xv=P/4 para ganar</p>Ancho x: <span id="vx">6.5</span><input id="sx" type="range" min="2" max="15" step="0.01" value="6.5">P: <span id="vp">40</span><input id="sp" type="range" min="10" max="80" step="0.01" value="40">h: <span id="vh">2.85</span><input id="sh" type="range" min="2.4" max="4.5" step="0.01" value="2.85"><div id="data" style="font-size:11px;color:#0f0;margin-top:6px"></div><div style="height:12px;background:#333;border-radius:6px;overflow:hidden;margin-top:6px"><div id="bar" style="height:100%;width:50%;background:#0f0"></div></div><div id="msg" style="font-size:11px;margin-top:4px">Busca el vertice!</div></div><div id="game"><h4 style="margin:0;color:#ff0">SCORE</h4><div id="score" style="font-size:32px;color:#0f0">0</div>Nivel <span id="level">1</span>/5<div id="msg2" style="font-size:10px;margin:6px 0"></div><button id="b1">¡CONSTRUIR!</button><button id="b2" style="display:none;background:#ff0">SIGUIENTE NIVEL</button></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);C.position.set(10,8,10);const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);const O=new OrbitControls(C,R.domElement);S.add(new THREE.AmbientLight(0xffffff,0.7));let M=new THREE.Mesh(new THREE.BoxGeometry(6.5,2.85,13.5),new THREE.MeshStandardMaterial({color:0x00ff88,opacity:0.8,transparent:true}));S.add(M);S.add(new THREE.GridHelper(40,40,0x00ff88,0x222222));let sc=0,lv=1,Ps=[40,50,32,60,44];function U(){let x=parseFloat(sx.value),P=parseFloat(sp.value),h=parseFloat(sh.value);vx.textContent=x.toFixed(2);vp.textContent=P.toFixed(2);vh.textContent=h.toFixed(2);let y=P/2-x;if(y<0.1)y=0.1;let A=-x*x+P/2*x,xv=P/4,Am=-xv*xv+P/2*xv,ef=A/Am*100;data.innerHTML=`A=${A.toFixed(2)} Amax=${Am.toFixed(2)}<br>xv=${xv.toFixed(2)} ef=${ef.toFixed(1)}%<br>V=${(A*h).toFixed(1)} C=${(1200*A+5000).toFixed(0)}`;bar.style.width=Math.min(100,ef)+'%';if(Math.abs(x-xv)<0.5){bar.style.background='#ff0';msg.textContent='¡OPTIMO! DALE CONSTRUIR!';msg.style.color='#0f0'}else{bar.style.background='#f00';msg.textContent='Ajusta x cerca de xv=P/4';msg.style.color='#fff'}M.geometry.dispose();M.geometry=new THREE.BoxGeometry(x,h,y);return{x,P,h,A,xv,Am,ef}} sx.oninput=U;sp.oninput=U;sh.oninput=U; b1.onclick=()=>{let d=U();if(Math.abs(d.x-d.xv)<0.5){sc+=Math.round(d.ef*10);score.textContent=sc;msg2.textContent='¡NIVEL SUPERADO!';M.material.color.set(0xffff00);setTimeout(()=>M.material.color.set(0x00ff88),400);if(lv>=5){msg2.textContent='¡JUEGO COMPLETADO! ERES MASTER';b1.style.display='none'}else{b2.style.display='block';b1.style.display='none'}}else{msg2.textContent=`Fallo: x debe ser ${d.xv.toFixed(2)}`;M.material.color.set(0xff0000);setTimeout(()=>M.material.color.set(0x00ff88),300)}}; b2.onclick=()=>{lv++;level.textContent=lv;sp.value=Ps[lv-1];b2.style.display='none';b1.style.display='block';U()};U();(function a(){requestAnimationFrame(a);O.update();R.render(S,C)})();</script></body></html>
