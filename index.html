<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GIL PARKOUR ARQ - ORIGINAL</title><style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:system-ui}canvas{display:block}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}#box{background:rgba(0,0,0,.75);color:#0f0;padding:8px 12px;border-radius:10px;border:1px solid #0f0;font-size:11px;min-width:120px}#joy{position:absolute;bottom:20px;left:20px;width:110px;height:110px;background:rgba(255,255,255,.2);border-radius:50%;border:2px solid #fff;touch-action:none}#knob{position:absolute;width:50px;height:50px;background:#0f0;border-radius:50%;left:30px;top:30px}#jump{position:absolute;bottom:30px;right:20px;width:80px;height:80px;background:rgba(255,215,0,.9);border-radius:50%;border:3px solid #fff;color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;user-select:none}#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;color:#fff;padding:20px;border-radius:12px;text-align:center;display:none;border:2px solid #0f0}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><div id="hud"><div id="box">GIL PARKOUR ARQ<br>LVL: <span id="lv">1</span> SCORE: <span id="sc">0</span><br>P=<span id="p">40</span> xv=<span id="xv">10</span><br>A=<span id="a">0</span> / Amax=<span id="am">0</span><div id="bar" style="height:6px;background:#333;border-radius:3px;margin-top:4px"><div id="fill" style="height:100%;width:0%;background:#0f0"></div></div></div><div id="box" style="color:#ffd700">🟡 COINS: <span id="coins">0</span>/5<br>CONTROLES: JOY IZQ + SALTO DER<br>WASD + ESPACIO en PC</div></div><div id="joy"><div id="knob"></div></div><div id="jump">SALTO</div><div id="msg"><h2 id="mt">¡NIVEL!</h2><p id="md"></p><button onclick="next()" style="background:#0f0;border:none;padding:10px 20px;border-radius:8px;font-weight:bold">CONTINUAR</button></div><script type="module">import*as THREE from'three';let S=new THREE.Scene();S.background=new THREE.Color(0x87CEEB);S.fog=new THREE.Fog(0x87CEEB,40,100);let C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,200);let R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);let light=new THREE.DirectionalLight(0xffffff,1);light.position.set(10,20,10);light.castShadow=true;S.add(light);S.add(new THREE.AmbientLight(0xffffff,.5));let player,vel=new THREE.Vector3(),onGround=false,yaw=0,score=0,level=1,coins=0,Ps=[40,52,36,60,44],plat=[],coinMesh=[];function makePlat(x,z,w,d,P,isBest){let g=new THREE.BoxGeometry(w,1,d);let m=new THREE.MeshStandardMaterial({color:isBest?0x00ff88:0x8888aa});let mesh=new THREE.Mesh(g,m);mesh.position.set(x,-1,z);mesh.receiveShadow=true;mesh.castShadow=true;mesh.userData={w,d,P,A:w*d,origX:x,origZ:z};S.add(mesh);plat.push(mesh);let canvas=document.createElement('canvas');canvas.width=256;canvas.height=64;let ctx=canvas.getContext('2d');ctx.fillStyle=isBest?'#0f0':'#fff';ctx.fillRect(0,0,256,64);ctx.fillStyle='#000';ctx.font='bold 20px monospace';ctx.fillText(`P=${P} A=${(w*d).toFixed(0)}`,10,38);let tex=new THREE.CanvasTexture(canvas);let spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));spr.position.set(x,2.5,z);spr.scale.set(6,1.5,1);S.add(spr);if(isBest){let ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.1,8,20),new THREE.MeshBasicMaterial({color:0xffff00}));ring.position.set(x,1,z);ring.rotation.x=Math.PI/2;S.add(ring);mesh.userData.ring=ring;}return mesh;}function makeCoin(x,z){let m=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.1,12),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffd700,emissiveIntensity:.3}));m.position.set(x,.8,z);m.rotation.x=Math.PI/2;S.add(m);coinMesh.push(m);}function buildLevel(lv){plat.forEach(p=>S.remove(p));coinMesh.forEach(c=>S.remove(c));plat=[];coinMesh=[];let P=Ps[lv-1];let xv=P/4,Amax=xv*xv;document.getElementById('p').textContent=P;document.getElementById('xv').textContent=xv.toFixed(1);document.getElementById('am').textContent=Amax.toFixed(0);document.getElementById('lv').textContent=lv;for(let i=0;i<7;i++){let best=i==3;let w=best?xv:2+Math.random()*8;let d=P/2-w;if(d<1)d=1+Math.random()*3;let x=(Math.random()-.5)*12;let z=-i*10;let pp=makePlat(x,z,w,d,P,best);if(i>0)makeCoin(x,z);}onGround=true;vel.set(0,0,0);player.position.set(0,1,5);}let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.4,.6,4,8),new THREE.MeshStandardMaterial({color:0x0066ff}));let head=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),new THREE.MeshStandardMaterial({color:0xffdbac}));head.position.y=.8;let helm=new THREE.Mesh(new THREE.CylinderGeometry(.38,.42,.25,12),new THREE.MeshStandardMaterial({color:0xffffff}));helm.position.y=1.05;g.add(body,head,helm);g.position.set(0,2,5);S.add(g);player=g;C.position.set(0,6,12);C.lookAt(player.position);let keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);let joy={x:0,y:0,act:false};let joyEl=document.getElementById('joy'),knob=document.getElementById('knob');function joyPos(e){let r=joyEl.getBoundingClientRect();let t=e.touches?e.touches[0]:e;let x=t.clientX-r.left-r.width/2;let y=t.clientY-r.top-r.height/2;let d=Math.hypot(x,y);let m=Math.min(d,40);let ang=Math.atan2(y,x);joy.x=Math.cos(ang)*m/40;joy.y=Math.sin(ang)*m/40;knob.style.left=30+joy.x*30+'px';knob.style.top=30+joy.y*30+'px';}joyEl.addEventListener('touchstart',e=>{joy.act=true;joyPos(e)});joyEl.addEventListener('touchmove',e=>{if(joy.act)joyPos(e)});joyEl.addEventListener('touchend',()=>{joy.act=false;joy.x=0;joy.y=0;knob.style.left='30px';knob.style.top='30px';});document.getElementById('jump').addEventListener('touchstart',e=>{e.preventDefault();if(onGround)vel.y=9});addEventListener('keydown',e=>{if(e.code=='Space'&&onGround)vel.y=9});let grav=-20;function loop(dt){requestAnimationFrame(()=>{let now=performance.now();loop((now-(loop.last||now))/1000);loop.last=now});let mv=new THREE.Vector3();if(keys['KeyW']||keys['ArrowUp'])mv.z=-1;if(keys['KeyS']||keys['ArrowDown'])mv.z=1;if(keys['KeyA']||keys['ArrowLeft'])mv.x=-1;if(keys['KeyD']||keys['ArrowRight'])mv.x=1;mv.x+=joy.x;mv.z+=joy.y;if(mv.length()>1)mv.normalize();mv.multiplyScalar(8*dt);player.position.x+=mv.x;player.position.z+=mv.z;vel.y+=grav*dt;player.position.y+=vel.y*dt;onGround=false;let curA=0;for(let p of plat){let dx=Math.abs(player.position.x-p.position.x);let dz=Math.abs(player.position.z-p.position.z);if(dx<p.userData.w/2+.5 && dz<p.userData.d/2+.5){if(player.position.y<=0.8 && player.position.y>0 && vel.y<=0){player.position.y=0.8;vel.y=0;onGround=true;curA=p.userData.A;let ef=curA/(Ps[level-1]/4*Ps[level-1]/4)*100;document.getElementById('a').textContent=curA.toFixed(0);document.getElementById('fill').style.width=Math.min(100,ef)+'%';if(p.userData.w==Ps[level-1]/4){p.material.color.set(0xffff00);if(!p.userData.win){p.userData.win=true;score+=100;document.getElementById('sc').textContent=score;}}}} }if(player.position.y< -5){player.position.set(0,1,5);vel.set(0,0,0);}for(let i=coinMesh.length-1;i>=0;i--){let c=coinMesh[i];c.rotation.z+=dt*3;if(player.position.distanceTo(c.position)<1.2){S.remove(c);coinMesh.splice(i,1);coins++;document.getElementById('coins').textContent=coins;score+=20;document.getElementById('sc').textContent=score;if(coins>=5){document.getElementById('mt').textContent=`¡NIVEL ${level} COMPLETADO!`;document.getElementById('md').textContent=`Optimización: Encontraste el lote óptimo con xv=P/4 = ${Ps[level-1]/4}. Score ${score}`;document.getElementById('msg').style.display='block';}}}C.position.lerp(new THREE.Vector3(player.position.x,player.position.y+6,player.position.z+12),0.08);C.lookAt(player.position);R.render(S,C);}loop(0);window.next=()=>{document.getElementById('msg').style.display='none';coins=0;document.getElementById('coins').textContent=0;level++;if(level>5){alert('¡JUEGO COMPLETADO! Eres Master Arquitecto GIL! Score Final:'+score);level=1;score=0;}buildLevel(level)};buildLevel(1);</script></body></html>
